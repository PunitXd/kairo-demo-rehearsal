apiVersion: v1
kind: Service
metadata:
  name: kairo-demo-rehearsal
  namespace: kairo-kairo-demo-rehearsal
  labels:
    app: kairo-demo-rehearsal
    app.kubernetes.io/managed-by: kairo
spec:
  # cluster-internal only: all outside traffic comes in through Traefik's
  # Ingress, so request metrics are always counted
  type: ClusterIP
  selector:
    app: kairo-demo-rehearsal
  ports:
    - name: http
      port: 80
      targetPort: 3000
